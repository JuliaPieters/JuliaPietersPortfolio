<div class="projects-page">
  <h1 class="page-title">Mijn Projecten</h1>

  <div class="projects-grid">
    <div class="project-card" (click)="openProject('afstudeeropdracht')">
      <div class="project-image-placeholder">Afstudeeropdracht</div>
      <div class="project-info">
        <h2>Afstudeeropdracht bij Nedbase Digital Agency</h2>
        <span class="project-year">2026</span>
      </div>
    </div>

    <div class="project-card" (click)="openProject('ek-zeilen')">
      <img src="assets/ekzeilen.png" alt="Microsite EK Zeilen">
      <div class="project-info">
        <h2>Micro website voor het EK zeilen</h2>
        <span class="project-year">2025</span>
      </div>
    </div>

    <div class="project-card" (click)="openProject('ots-website')">
      <img src="assets/otswebsite.png" alt="OTS Website voor Nedbase">
      <div class="project-info">
        <h2>OTS-website voor Nedbase</h2>
        <span class="project-year">2025</span>
      </div>
    </div>

    <div class="project-card" (click)="openProject('minor-IUXD')">
      <img src="assets/worm.jpg" alt="Minor Interface & UX Design">
      <div class="project-info">
        <h2>Minor Interface & UX Design</h2>
        <span class="project-year">2025</span>
      </div>
    </div>

    <div class="project-card" (click)="openProject('rijkswaterstaat')">
      <img src="assets/krammersluis.jpg" alt="Rijkswaterstaat Krammersluizen">
      <div class="project-info">
        <h2>Rijkswaterstaat, Krammersluizen</h2>
        <span class="project-year">2024</span>
      </div>
    </div>

    <div class="project-card" (click)="openProject('anxiety-ally')">
      <img src="assets/anxietyally.png" alt="AnxietyAlly app">
      <div class="project-info">
        <h2>AnxietyAlly</h2>
        <span class="project-year">2024</span>
      </div>
    </div>

    <div class="project-card" (click)="openProject('pontes')">
      <img src="assets/1631362549919.jpeg" alt="Scholengroep de Pontes">
      <div class="project-info">
        <h2>Scholengroep de Pontes</h2>
        <span class="project-year">2023</span>
      </div>
    </div>

    <div class="project-card" (click)="openProject('kees-closed')">
      <img src="assets/keesclosed.jpg" alt="Kees Closed computerspel">
      <div class="project-info">
        <h2>Kees Closed</h2>
        <span class="project-year">2023</span>
      </div>
    </div>
  </div>
</div>
